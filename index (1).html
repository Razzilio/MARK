<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABS-CBN Online Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="page-login" class="page active">
  <div class="login-card">

    <div class="logo-area">
      <div class="logo-badge">
        <img src="applogo.jpg" style="width:100%;height:100%;object-fit:contain;">
      </div>
      <div class="logo-wordmark">
        <div class="brand">ABS-CBN Bank</div>
        <div class="tagline">The Kapamilya Bank</div>
      </div>
    </div>

    <div class="section-title">Welcome Back</div>
    <div class="section-sub">Sign in to continue your secure banking.</div>

    <div class="form-group">
      <label>Account Number or Username</label>
      <input type="text" id="loginUsername" placeholder="Enter account details">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>

    <button class="btn btn-primary" onclick="handleLogin()">Secure Sign In</button>

    <div class="divider"><span>or browse</span></div>
    <button class="btn btn-green" onclick="switchPage('page-register')">Create an Account</button>

  </div>
</div>

<div id="page-register" class="page">
  <div class="register-card">

    <div class="section-title">Open a New Account</div>
    <div class="section-sub">Join ABS-CBN Bank online system today.</div>

    <div class="form-row">
      <input type="text" id="regFirst" placeholder="First Name">
      <input type="text" id="regLast" placeholder="Last Name">
    </div>

    <div class="form-group">
      <label>Birthday</label>
      <input type="date" id="regBirthday">
    </div>

    <div class="form-group">
      <label>Account Type</label>
      <select id="regType">
        <option>Savings Account</option>
        <option>Checking Account</option>
        <option>Tax-Free Account</option>
      </select>
    </div>

    <div class="form-group">
      <label>Create Password</label>
      <input type="password" id="regPassword" placeholder="Minimum 8 characters">
    </div>

    <button class="btn btn-primary" onclick="handleRegister()">Complete Registration</button>

  </div>
</div>

<div id="page-dashboard" class="page">

  <aside class="sidebar">
    <div class="brand-name">ABS-CBN Bank</div>

    <nav>
      <button onclick="activateSection('overview')">Overview</button>
      <button onclick="activateSection('transfer')">Transfer</button>
      <button onclick="activateSection('savings')">Savings</button>
      <button onclick="activateSection('loan')">Loan</button>
      <button onclick="activateSection('withdraw')">Withdraw</button>
      <button onclick="activateSection('balance')">Balance</button>
      <button onclick="activateSection('history')">History</button>
      <button onclick="activateSection('profile')">Profile</button>
    </nav>
  </aside>

  <main class="main-area">

    <header class="topbar">
      <div id="pageTitle">Overview</div>
    </header>

    <div class="content">

      <!-- PROFILE -->
      <div id="view-profile" class="section-panel">

        <div class="card">
          <div style="display:flex;gap:20px;">
            <div class="user-avatar" id="profAvatar">U</div>

            <div>
              <h3 id="profName">User</h3>
              <p id="profSub">Registered Member</p>
            </div>
          </div>

          <div class="profile-grid">

            <div class="box">
              <div class="label">Account Number</div>
              <div id="profAccNum">----</div>
            </div>

            <div class="box">
              <div class="label">Account Type</div>
              <div id="profType">----</div>
            </div>

            <!-- CLEANED SECTION (removed ID/KYC wording) -->
            <div class="box full">
              <div class="label">Account Status</div>
              <div style="color:green;font-weight:600;">
                Active and Ready for Transactions
              </div>
            </div>

          </div>
        </div>

      </div>

    </div>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>
